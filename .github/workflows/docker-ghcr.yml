name: Build production image

on:
  workflow_dispatch:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: extras/docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mikaelsiidorow/wger:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-production:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote production tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/mikaelsiidorow/wger:production \
            ghcr.io/mikaelsiidorow/wger:sha-${{ github.sha }}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: promote-production
    uses: MikaelSiidorow/infra/.github/workflows/k8s-rollout.yml@main
    with:
      namespace: wger
      deployments: wger-web,wger-celery-worker,wger-celery-beat
    secrets:
      HEADSCALE_PREAUTH_KEY: ${{ secrets.HEADSCALE_AUTH_KEY }}
      K8S_DEPLOY_KUBECONFIG: ${{ secrets.K8S_DEPLOY_KUBECONFIG }}
